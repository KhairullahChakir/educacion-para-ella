<div class="space-y-3 pt-1">
    <div class="flex items-center gap-2 text-xs font-semibold text-slate-700 bg-white px-4 py-3 rounded-xl border border-slate-200/90 shadow-2xs">
        <span class="text-base">🔒</span>
        <span>Password is <strong>encrypted & securely stored</strong> using industry-standard hashing (PBKDF2-SHA256).</span>
    </div>
    {% if not empty %}
    <div>
        <a href="{{ password_reset_url }}" class="inline-flex items-center gap-2 px-4 py-2.5 text-xs font-black uppercase tracking-wider text-slate-900 bg-[#fbbf24] hover:bg-[#f59e0b] rounded-xl shadow-xs hover:shadow-md transition-all cursor-pointer">
            <span>🔑 Reset / Change User Password</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </a>
    </div>
    {% endif %}
</div>
